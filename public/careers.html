<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Careers & Job Openings - View active executive and specialist job openings in Chennai and register your candidate profile with SGS HR Workforce Solutions.">
  <title>Careers & Job Openings | SGS HR Workforce Solutions</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .job-card {
      background-color: var(--white);
      border-radius: var(--border-radius-md);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      border: 1.5px solid var(--border-color);
      transition: var(--transition-normal);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .job-card:hover {
      border-color: var(--french-blue);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .job-title {
      font-size: 1.25rem;
      color: var(--deep-twilight);
      font-weight: 700;
    }
    .job-badge {
      background-color: var(--light-cyan);
      color: var(--deep-twilight);
      padding: 0.25rem 0.75rem;
      border-radius: var(--border-radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .job-meta {
      display: flex;
      gap: 1rem;
      color: var(--text-gray);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    .job-meta-item {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .job-desc {
      font-size: 0.95rem;
      color: var(--text-dark);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .careers-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 4rem;
      align-items: start;
    }
    .form-card {
      background-color: var(--white);
      border-radius: var(--border-radius-md);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      position: sticky;
      top: 6.5rem;
    }
    @media (max-width: 992px) {
      .careers-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
      .form-card {
        position: static;
      }
    }
  </style>
</head>
<body>

  <!-- Injected Header -->
  <div id="site-header"></div>

  <!-- Page Banner -->
  <section class="page-banner">
    <div class="container">
      <h2 class="page-title">Careers Portal</h2>
      <div class="page-breadcrumbs">
        <a href="index.html">Home</a> &gt; <span>Careers</span>
      </div>
    </div>
  </section>

  <!-- Careers Segment -->
  <section class="section">
    <div class="container">
      <div class="careers-grid">
        
        <!-- Left Column: Job Listings -->
        <div class="fade-in">
          <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.75rem; color: var(--deep-twilight); margin-bottom: 1.5rem; border-bottom: 2px solid var(--light-cyan); padding-bottom: 0.5rem;">
            Current Job Openings
          </h2>
          
          <!-- Job List Container -->
          <div id="jobs-container" style="display: grid; gap: 1.5rem;">
            <!-- Loading indicator -->
            <p style="text-align: center; color: var(--text-gray); padding: 3rem 0;">Searching for active career roles...</p>
          </div>
        </div>

        <!-- Right Column: Candidate Registration -->
        <div class="fade-in" style="transition-delay: 0.1s;">
          <div class="form-card">
            <h2 id="form-title" style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; color: var(--deep-twilight); margin-bottom: 0.5rem;">
              Candidate Registration
            </h2>
            <p style="color: var(--text-gray); font-size: 0.875rem; margin-bottom: 1.75rem;">
              Submit your resume below to apply for a listed position or join our general executive talent pool.
            </p>

            <form id="candidate-form" enctype="multipart/form-data">
              <input type="hidden" id="appliedFor" name="appliedFor" value="General Registration">

              <div class="form-group">
                <label for="name" class="form-label">Full Name *</label>
                <input type="text" id="name" name="name" class="form-input" required placeholder="sidd">
              </div>

              <div class="form-group">
                <label for="email" class="form-label">Email Address *</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="sidd@example.com">
              </div>

              <div class="form-group">
                <label for="phone" class="form-label">Phone Number *</label>
                <input type="tel" id="phone" name="phone" class="form-input" required placeholder="9876543210">
              </div>

              <div class="form-group">
                <label for="experience" class="form-label">Years of Experience *</label>
                <select id="experience" name="experience" class="form-select" required>
                  <option value="" disabled selected>Select experience level</option>
                  <option value="Fresher (0 - 1 year)">Fresher (0 - 1 year)</option>
                  <option value="Entry Level (1 - 3 years)">Entry Level (1 - 3 years)</option>
                  <option value="Mid-Management (3 - 7 years)">Mid-Management (3 - 7 years)</option>
                  <option value="Senior Level (7 - 12 years)">Senior Level (7 - 12 years)</option>
                  <option value="Executive / Leadership (12+ years)">Executive / Leadership (12+ years)</option>
                </select>
              </div>

              <div class="form-group">
                <label for="resume" class="form-label">Upload Resume (PDF, Word) *</label>
                <input type="file" id="resume" name="resume" class="form-input" accept=".pdf,.doc,.docx" required>
                <small style="color: var(--text-gray); font-size: 0.75rem; display: block; margin-top: 0.25rem;">Max file size: 10MB (.pdf, .doc, .docx only)</small>
              </div>

              <div class="form-group">
                <label for="coverLetter" class="form-label">Cover Letter / Additional Details</label>
                <textarea id="coverLetter" name="coverLetter" class="form-textarea" placeholder="Briefly describe your career objectives and skills..."></textarea>
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
                Submit Profile
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Injected Footer -->
  <div id="site-footer"></div>

  <!-- JS Modules -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const jobsContainer = document.getElementById('jobs-container');
      const candidateForm = document.getElementById('candidate-form');
      const appliedForInput = document.getElementById('appliedFor');
      const formTitle = document.getElementById('form-title');

      // Fetch and Render Job Listings
      try {
        const jobs = await API.getJobs();
        
        if (!jobs || jobs.length === 0) {
          jobsContainer.innerHTML = `
            <div style="background-color: var(--bg-secondary); border: 1.5px dashed var(--border-color); border-radius: var(--border-radius-md); padding: 3rem; text-align: center; color: var(--text-gray);">
              <span style="font-size: 2.5rem; display: block; margin-bottom: 1rem;">🔍</span>
              <h3>No Active Openings Right Now</h3>
              <p style="margin-top: 0.5rem; font-size: 0.95rem;">
                We are actively discussing new roles with our clients in Chennai. Please register your profile using the form and we will notify you when matching roles open.
              </p>
            </div>
          `;
        } else {
          jobsContainer.innerHTML = '';
          jobs.forEach(job => {
            const card = document.createElement('div');
            card.className = 'job-card';
            
            // Build requirements list items
            const reqListItems = job.requirements.slice(0, 2).map(req => `<li>• ${req}</li>`).join('');
            
            card.innerHTML = `
              <div>
                <div class="job-header">
                  <h3 class="job-title">${job.title}</h3>
                  <span class="job-badge">${job.type}</span>
                </div>
                <div class="job-meta">
                  <span class="job-meta-item">📍 ${job.location}</span>
                  <span class="job-meta-item"> ${job.experience}</span>
                  ${job.salary ? `<span class="job-meta-item"> ${job.salary}</span>` : ''}
                </div>
                <p class="job-desc">${job.description}</p>
                <ul style="font-size: 0.875rem; color: var(--text-gray); margin-bottom: 1.5rem; list-style: none;">
                  ${reqListItems}
                  ${job.requirements.length > 2 ? `<li style="font-style: italic;">+ ${job.requirements.length - 2} more requirements</li>` : ''}
                </ul>
              </div>
              <button class="btn btn-outline apply-btn" data-title="${job.title}" style="align-self: flex-start;">
                Apply Now
              </button>
            `;
            jobsContainer.appendChild(card);
          });

          // Add Apply Click Listeners
          document.querySelectorAll('.apply-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const title = e.target.getAttribute('data-title');
              appliedForInput.value = title;
              formTitle.innerHTML = `Apply for <span style="color: var(--bright-teal-blue);">${title}</span>`;
              
              // Scroll to form card
              const formCard = document.querySelector('.form-card');
              formCard.scrollIntoView({ behavior: 'smooth' });
              
              // Light highlight effect
              formCard.style.boxShadow = '0 10px 25px rgba(2, 62, 138, 0.25)';
              setTimeout(() => {
                formCard.style.boxShadow = 'var(--shadow-lg)';
              }, 2000);
            });
          });
        }
      } catch (error) {
        console.error('Failed to load jobs list:', error);
        jobsContainer.innerHTML = '<p style="color: red; text-align: center; padding: 2rem 0;">Error retrieving active jobs. Please check network connectivity.</p>';
      }

      // Handle Candidate Registration Submission
      candidateForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = candidateForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting profile...';

        const formData = new FormData(candidateForm);

        try {
          const result = await API.registerCandidate(formData);
          window.showToast(result.msg || 'Application submitted successfully!', 'success');
          
          // Reset form and title
          candidateForm.reset();
          appliedForInput.value = 'General Registration';
          formTitle.innerHTML = 'Candidate Registration';
        } catch (error) {
          window.showToast(error.message || 'Error submitting profile. Please check parameters.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });

    });
  </script>
</body>
</html>
